  <g id="text_23">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #354c5c" transform="translate(49.536 317.923719)">The official BTS source uses scheduled totals; the completed-flight view is constructed here.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #354c5c" transform="translate(49.536 327.441859)">Cancelled and diverted flights are excluded only from the constructed denominator.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #354c5c" transform="translate(49.536 336.96)">Nominal carrier cells; no passenger-delay, causal or verified operating-only claim.</text>
